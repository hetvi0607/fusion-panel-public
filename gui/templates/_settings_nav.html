<div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-900">Settings</h1>
    <p class="mt-1 text-sm text-gray-500">
        Configure the application and manage reusable workspace data.
    </p>
</div>

<div class="lg:grid lg:grid-cols-[220px_minmax(0,1fr)] lg:gap-8 lg:items-start">
    <div class="mb-6 lg:mb-0">
        <!-- Mobile / tablet: dropdown selector -->
        <div class="lg:hidden">
            <label for="settings-nav-select" class="sr-only">Select a settings section</label>
            <div class="relative">
                <select id="settings-nav-select"
                        class="block w-full appearance-none rounded-lg border border-gray-200 bg-white py-2.5 pl-4 pr-10 text-sm font-semibold text-gray-900 shadow-sm focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900"
                        onchange="if (this.value) { window.location.href = this.value; }">
                    <option value="{{ url_for('settings_page') }}" {% if request.path == '/settings' %}selected{% endif %}>App Config</option>
                    <option value="{{ url_for('repos_page') }}" {% if request.path.startswith('/settings/repositories') %}selected{% endif %}>Repositories</option>
                    <option value="{{ url_for('clients_page') }}" {% if request.path.startswith('/settings/clients') %}selected{% endif %}>Clients</option>
                    <option value="{{ url_for('company_settings') }}" {% if request.path.startswith('/settings/company') %}selected{% endif %}>My Company Details</option>
                    <option value="{{ url_for('branding_settings') }}" {% if request.path.startswith('/settings/branding') %}selected{% endif %}>Stamp &amp; Signature</option>
                    <option value="{{ url_for('backup_page') }}" {% if request.path.startswith('/settings/backup') %}selected{% endif %}>Backup &amp; Restore</option>
                    <option value="{{ url_for('logs_page') }}" {% if request.path.startswith('/settings/logs') %}selected{% endif %}>Logs</option>
                    <option value="{{ url_for('setup_login_password') }}" {% if request.path == '/settings/login-password' %}selected{% endif %}>Login Password</option>
                </select>
                <i class="fa-solid fa-chevron-down pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-gray-400"></i>
            </div>
        </div>

        <!-- Desktop: vertical sidebar -->
        <nav class="hidden lg:block lg:sticky lg:top-24 space-y-1 rounded-xl border border-gray-200 bg-white p-2 shadow-sm"
             aria-label="Settings sections">
            <a href="{{ url_for('settings_page') }}"
               class="flex items-center rounded-lg px-3 py-2 text-sm font-semibold transition-colors
                      {% if request.path == '/settings' %}bg-gray-900 text-white{% else %}text-gray-600 hover:bg-gray-100 hover:text-gray-900{% endif %}">
                <i class="fa-solid fa-sliders mr-2.5 w-4 text-center"></i>App Config
            </a>
            <a href="{{ url_for('repos_page') }}"
               class="flex items-center rounded-lg px-3 py-2 text-sm font-semibold transition-colors
                      {% if request.path.startswith('/settings/repositories') %}bg-gray-900 text-white{% else %}text-gray-600 hover:bg-gray-100 hover:text-gray-900{% endif %}">
                <i class="fa-solid fa-code-branch mr-2.5 w-4 text-center"></i>Repositories
            </a>
            <a href="{{ url_for('clients_page') }}"
               class="flex items-center rounded-lg px-3 py-2 text-sm font-semibold transition-colors
                      {% if request.path.startswith('/settings/clients') %}bg-gray-900 text-white{% else %}text-gray-600 hover:bg-gray-100 hover:text-gray-900{% endif %}">
                <i class="fa-solid fa-building mr-2.5 w-4 text-center"></i>Clients
            </a>
            <a href="{{ url_for('company_settings') }}"
               class="flex items-center rounded-lg px-3 py-2 text-sm font-semibold transition-colors
                      {% if request.path.startswith('/settings/company') %}bg-gray-900 text-white{% else %}text-gray-600 hover:bg-gray-100 hover:text-gray-900{% endif %}">
                <i class="fa-solid fa-briefcase mr-2.5 w-4 text-center"></i>My Company Details
            </a>
            <a href="{{ url_for('branding_settings') }}"
               class="flex items-center rounded-lg px-3 py-2 text-sm font-semibold transition-colors
                      {% if request.path.startswith('/settings/branding') %}bg-gray-900 text-white{% else %}text-gray-600 hover:bg-gray-100 hover:text-gray-900{% endif %}">
                <i class="fa-solid fa-stamp mr-2.5 w-4 text-center"></i>Stamp &amp; Signature
            </a>
            <a href="{{ url_for('backup_page') }}"
               class="flex items-center rounded-lg px-3 py-2 text-sm font-semibold transition-colors
                      {% if request.path.startswith('/settings/backup') %}bg-gray-900 text-white{% else %}text-gray-600 hover:bg-gray-100 hover:text-gray-900{% endif %}">
                <i class="fa-solid fa-database mr-2.5 w-4 text-center"></i>Backup &amp; Restore
            </a>
            <a href="{{ url_for('logs_page') }}"
               class="flex items-center rounded-lg px-3 py-2 text-sm font-semibold transition-colors
                      {% if request.path.startswith('/settings/logs') %}bg-gray-900 text-white{% else %}text-gray-600 hover:bg-gray-100 hover:text-gray-900{% endif %}">
                <i class="fa-solid fa-list-check mr-2.5 w-4 text-center"></i>Logs
            </a>
            <a href="{{ url_for('setup_login_password') }}"
               class="flex items-center rounded-lg px-3 py-2 text-sm font-semibold transition-colors
                      {% if request.path == '/settings/login-password' %}bg-gray-900 text-white{% else %}text-gray-600 hover:bg-gray-100 hover:text-gray-900{% endif %}">
                <i class="fa-solid fa-user-shield mr-2.5 w-4 text-center"></i>Login Password
            </a>
        </nav>
    </div>

    <div class="min-w-0">
